<!-- ════════════════════════════════════════════════════
  IM MOTORS AZ · v2 — 00-pages.html
  КУДА: вместе с 00-globals в «HTML-код для вставки внутрь head» (один раз на сайт).
  Стили и скрипты внутренних страниц: страницы моделей (m1…m8), тест-драйв, салон, документы, 404.
════════════════════════════════════════════════════ -->
<style>
  /* якоря не прячутся под фиксированной шапкой (переходы вида /#imxStock с других страниц) */
  [id^="imx"]{scroll-margin-top:72px;}
  /* страница не уезжает вбок, даже если что-то вылезет за край экрана */
  html,body{overflow-x:clip;}
  /* телефон: появление блоков при прокрутке короче и мягче — содержимое не «плывёт» */
  @media (max-width:700px){.imx-r{transform:translateY(16px);transition-duration:.7s;}}
  /* редактор Tilda: всё видно сразу, подменю модели не мешает */
  #allrecords[data-tilda-mode="edit"] .imx-r{opacity:1 !important;transform:none !important;}
  #allrecords[data-tilda-mode="edit"] .imx-msub{display:none;}

  /* ── m1 · шапка модели ── */
  .imx-mh{position:relative;height:100vh;height:100svh;min-height:640px;max-height:1080px;overflow:hidden;background:var(--imx-bg);display:flex;align-items:flex-end;}
  .imx-mh__bg{position:absolute;inset:0;margin:0;}
  .imx-mh__bg picture{display:contents;}
  .imx-mh__bg img{width:100%;height:100%;object-fit:cover;object-position:var(--dpos,50% 50%);animation:imxMhZoom 2.6s var(--imx-ease) both;}
  @keyframes imxMhZoom{from{transform:scale(1.07);}to{transform:none;}}
  .imx-mh__bg::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(10,10,11,.8) 0%,rgba(10,10,11,.5) 32%,rgba(10,10,11,0) 60%),
               linear-gradient(0deg,var(--imx-bg) 0%,rgba(10,10,11,.35) 20%,rgba(10,10,11,0) 42%),
               linear-gradient(180deg,rgba(10,10,11,.6) 0%,rgba(10,10,11,0) 16%);}
  .imx-mh__in{position:relative;z-index:1;width:100%;padding-bottom:clamp(40px,7vh,84px);}
  .imx-mh__name{font:400 clamp(64px,9vw,150px)/.86 var(--imx-brand);letter-spacing:-.02em;margin:20px 0 20px;}
  .imx-mh__name b{font-weight:700;}
  .imx-mh__tag{font:300 clamp(17px,1.45vw,22px)/1.4 var(--imx-display);color:var(--imx-mute);max-width:540px;}
  .imx-mh__row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px 48px;flex-wrap:wrap;margin-top:clamp(28px,4.5vh,48px);}
  .imx-mh__specs{display:flex;gap:clamp(24px,3.4vw,56px);}
  .imx-mh__specs div{font:300 clamp(28px,2.6vw,40px)/1 var(--imx-display);letter-spacing:-.03em;white-space:nowrap;}
  .imx-mh__specs small{display:block;margin-top:10px;font:500 10.5px/1.45 var(--imx-text);letter-spacing:.16em;text-transform:uppercase;color:var(--imx-dim);}
  .imx-mh__ctas{display:flex;gap:12px;flex-wrap:wrap;}
  .imx-mh__badge{display:inline-block;margin-left:14px;padding:6px 10px;border-radius:3px;background:var(--imx-accent);color:#fff;font:600 10px/1 var(--imx-text);letter-spacing:.14em;vertical-align:middle;}
  @media (max-width:700px){
    .imx-mh{height:auto;min-height:0;max-height:none;display:block;}
    /* overflow:hidden — при появлении фото увеличено (imxMhZoom), без обрезки его край заезжал на название модели */
    .imx-mh__bg{position:relative;height:60vh;height:60svh;min-height:360px;overflow:hidden;}
    .imx-mh__bg img{object-position:var(--pos,70% 50%);}
    /* плавный переход фото в фон: без резкой границы поперёк названия модели */
    .imx-mh__bg::after{background:linear-gradient(180deg,rgba(10,10,11,.55) 0%,rgba(10,10,11,0) 22%),linear-gradient(0deg,var(--imx-bg) 0%,rgba(10,10,11,.94) 10%,rgba(10,10,11,.72) 24%,rgba(10,10,11,.38) 40%,rgba(10,10,11,.12) 54%,rgba(10,10,11,0) 66%);}
    .imx-mh__in{margin-top:-64px;padding-bottom:40px;}
    .imx-mh__name{margin:14px 0 14px;}
    .imx-mh__specs{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
    .imx-mh__specs div{font-size:24px;white-space:normal;}
    .imx-mh__specs small{font-size:10px;letter-spacing:.1em;}
    .imx-mh__ctas{width:100%;}
    .imx-mh__ctas .imx-btn{flex:1 1 auto;}
  }

  /* ── подменю модели: появляется, когда шапка модели ушла вверх ── */
  .imx-msub{position:fixed;left:0;right:0;top:0;z-index:9980;background:rgba(10,10,11,.86);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--imx-line);transform:translateY(-110%);transition:transform .5s var(--imx-ease);}
  .imx-msub.is-on{transform:translateY(0);}
  .imx-msub.is-on.is-under{transform:translateY(76px);}
  .imx-msub__in{height:58px;display:flex;align-items:center;gap:28px;}
  .imx-msub__name{font:400 20px/1 var(--imx-brand);white-space:nowrap;}
  .imx-msub__name b{font-weight:700;}
  .imx-msub__nav{display:flex;gap:24px;margin:0 auto;overflow-x:auto;scrollbar-width:none;}
  .imx-msub__nav::-webkit-scrollbar{display:none;}
  .imx-msub__nav a{font-size:13px;color:var(--imx-mute);white-space:nowrap;padding:6px 0;position:relative;transition:color .3s;}
  .imx-msub__nav a:hover,.imx-msub__nav a.is-on{color:var(--imx-fg);}
  .imx-msub__nav a.is-on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--imx-accent);}
  @media (max-width:900px){
    .imx-msub.is-on.is-under{transform:translateY(64px);}
    .imx-msub__in{height:52px;gap:16px;}
    .imx-msub__name{font-size:17px;}
    /* края ленты разделов растворяются — видно, что её можно листать, и обрезанные слова не торчат */
    .imx-msub__nav{margin:0;gap:18px;flex:1;padding:0 28px 0 12px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 28px),transparent 100%);}
    .imx-msub__cta{display:none;}
  }

  /* ── общий заголовок секции внутренних страниц ── */
  .imx-sec{background:var(--imx-bg);padding:clamp(64px,8vw,120px) 0;}
  .imx-sec__head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 40px;flex-wrap:wrap;margin-bottom:clamp(32px,4vw,56px);}
  .imx-sec__head .imx-h2{margin-top:22px;}
  .imx-sec__t{font:300 clamp(34px,4.2vw,64px)/1.02 var(--imx-display);letter-spacing:-.04em;margin-top:22px;}
  .imx-sec__t b{font-weight:500;}

  /* круглые стрелки для лент */
  .imx-arrows{display:flex;gap:8px;}
  .imx-arrows button{width:48px;height:48px;border-radius:50%;border:1px solid var(--imx-line);display:grid;place-items:center;transition:border-color .3s,opacity .3s;}
  .imx-arrows button:hover:not(:disabled){border-color:var(--imx-fg);}
  .imx-arrows button:disabled{opacity:.3;cursor:default;}
  .imx-arrows svg{width:16px;height:16px;}

  /* ── m2 · обзор: заявление + 4 цифры ── */
  .imx-mo__grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px clamp(32px,6vw,110px);align-items:end;}
  .imx-mo__figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px clamp(16px,2.4vw,40px);margin-top:clamp(48px,6vw,96px);}
  .imx-mo__figs > div{border-top:1px solid var(--imx-line);padding-top:24px;}
  .imx-mo__figs b{display:block;font:200 clamp(44px,4.4vw,72px)/1 var(--imx-display);letter-spacing:-.05em;white-space:nowrap;}
  .imx-mo__figs b small{font-size:.34em;font-weight:300;letter-spacing:0;margin-left:6px;color:var(--imx-mute);}
  .imx-mo__figs span{display:block;margin-top:14px;font:500 10.5px/1.5 var(--imx-text);letter-spacing:.16em;text-transform:uppercase;color:var(--imx-dim);}
  @media (max-width:900px){.imx-mo__grid{grid-template-columns:1fr;align-items:start;}.imx-mo__figs{grid-template-columns:1fr 1fr;}}

  /* ── m3 · дизайн: лента больших фото ── */
  .imx-md{overflow:hidden;}
  .imx-md__track{display:flex;gap:clamp(12px,1.4vw,20px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
    padding:0 max(var(--imx-pad),calc((100vw - var(--imx-max))/2 + var(--imx-pad)));scroll-padding:0 max(var(--imx-pad),calc((100vw - var(--imx-max))/2 + var(--imx-pad)));}
  .imx-md__track::-webkit-scrollbar{display:none;}
  .imx-md__item{flex:0 0 min(1040px,76vw);scroll-snap-align:start;margin:0;}
  .imx-md__ph{aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--imx-bg2);}
  .imx-md__ph img{width:100%;height:100%;object-fit:cover;object-position:var(--p,50% 50%);transition:transform 1.4s var(--imx-ease);}
  .imx-md__item:hover .imx-md__ph img{transform:scale(1.03);}
  .imx-md__cap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 32px;padding:22px 2px 0;}
  .imx-md__cap b{font:400 clamp(19px,1.5vw,23px)/1.25 var(--imx-display);letter-spacing:-.02em;}
  .imx-md__cap span{font-size:14px;line-height:1.6;color:var(--imx-mute);}
  @media (max-width:700px){.imx-md__item{flex-basis:86vw;}.imx-md__ph{aspect-ratio:4/3;}.imx-md__cap{grid-template-columns:1fr;}.imx-md .imx-arrows{display:none;}}

  /* ── m4 · цвета: машина в «студии» + образцы ── */
  .imx-mc__stage{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/8;min-height:360px;
    background:radial-gradient(ellipse 72% 64% at 50% 56%,#f7f5f1 0%,#e4e0da 50%,#c8c4bd 100%);}
  .imx-mc__stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(180deg,rgba(14,14,16,0) 0%,rgba(14,14,16,.07) 100%);}
  .imx-mc__car{position:absolute;inset:-4% 4% -8%;margin:0;opacity:0;transform:translateX(28px) scale(.985);transition:opacity .7s var(--imx-ease),transform 1s var(--imx-ease);}
  .imx-mc__car.is-on{opacity:1;transform:none;}
  .imx-mc__car img{width:100%;height:100%;object-fit:contain;transform:scale(1.12);}
  .imx-mc__bar{display:flex;justify-content:space-between;align-items:center;gap:20px 32px;margin-top:24px;flex-wrap:wrap;}
  .imx-mc__name{font:300 clamp(22px,2vw,30px)/1.1 var(--imx-display);letter-spacing:-.02em;min-height:1.1em;}
  .imx-mc__name > span{display:none;}
  .imx-mc__name > span.is-on{display:block;}
  .imx-mc__sw{display:flex;gap:14px;flex-wrap:wrap;}
  .imx-mc__sw button{width:40px;height:40px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 -10px 16px rgba(0,0,0,.28);position:relative;transition:transform .3s var(--imx-ease);}
  .imx-mc__sw button::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid transparent;transition:border-color .3s;}
  .imx-mc__sw button:hover{transform:scale(1.08);}
  .imx-mc__sw button.is-on::after{border-color:var(--imx-fg);}
  .imx-mc__note{font-size:11px;color:var(--imx-dim);margin-top:18px;}
  @media (max-width:700px){.imx-mc__stage{aspect-ratio:4/3;min-height:0;}.imx-mc__car{inset:0 -4% -4%;}.imx-mc__sw{gap:12px;}.imx-mc__sw button{width:36px;height:36px;}}

  /* ── m5 · салон ── */
  .imx-mi__hero{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:21/9;min-height:420px;background:var(--imx-bg2);}
  .imx-mi__hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--p,50% 50%);}
  .imx-mi__hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,11,.86) 0%,rgba(10,10,11,.25) 38%,rgba(10,10,11,0) 60%);}
  .imx-mi__over{position:absolute;left:clamp(24px,3vw,48px);right:clamp(24px,3vw,48px);bottom:clamp(24px,3vw,44px);z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:16px 40px;}
  .imx-mi__over .imx-lead{color:rgba(244,242,238,.8);}
  .imx-mi__feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px clamp(20px,2.4vw,40px);margin-top:clamp(40px,5vw,72px);}
  .imx-mi__feat > div{border-top:1px solid var(--imx-line);padding-top:22px;}
  .imx-mi__feat b{display:block;font:400 18px/1.3 var(--imx-display);letter-spacing:-.01em;}
  .imx-mi__feat p{font-size:14px;line-height:1.6;color:var(--imx-mute);margin-top:10px;}
  .imx-mi__gal{display:grid;grid-template-columns:2fr 1fr 1fr;gap:clamp(10px,1.2vw,16px);margin-top:clamp(40px,5vw,72px);}
  .imx-mi__gal figure{margin:0;border-radius:6px;overflow:hidden;aspect-ratio:4/3;background:var(--imx-bg2);}
  .imx-mi__gal figure:first-child{aspect-ratio:auto;}
  .imx-mi__gal img{width:100%;height:100%;object-fit:cover;object-position:var(--p,50% 50%);transition:transform 1.4s var(--imx-ease);}
  .imx-mi__gal figure:hover img{transform:scale(1.04);}
  @media (max-width:900px){.imx-mi__feat{grid-template-columns:1fr 1fr;}.imx-mi__gal{grid-template-columns:1fr 1fr;}.imx-mi__gal figure:first-child{grid-column:1/-1;aspect-ratio:16/9;}}
  /* телефон: фото салона сверху, текст под ним — длинный текст поверх светлого фото читался плохо */
  @media (max-width:700px){
    .imx-mi__hero{aspect-ratio:auto;min-height:0;overflow:visible;background:none;border-radius:0;}
    .imx-mi__hero img{position:relative;inset:auto;height:auto;aspect-ratio:4/3;border-radius:6px;}
    .imx-mi__hero::after{display:none;}
    .imx-mi__over{position:relative;left:auto;right:auto;bottom:auto;margin-top:26px;flex-direction:column;align-items:flex-start;}
    .imx-mi__over .imx-lead{color:var(--imx-mute);}
    .imx-mi__feat{grid-template-columns:1fr;}
  }

  /* ── m6 · технологии: вкладки ── */
  .imx-tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--imx-line);border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;}
  .imx-tabs::-webkit-scrollbar{display:none;}
  .imx-tabs button{flex:0 0 auto;padding:12px 20px;border-radius:999px;font:500 13px/1 var(--imx-text);color:var(--imx-mute);white-space:nowrap;transition:background .35s,color .35s;}
  .imx-tabs button:hover{color:var(--imx-fg);}
  .imx-tabs button.is-on{background:var(--imx-fg);color:var(--imx-ink);}
  .imx-mt__pane{display:none;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px clamp(28px,4vw,72px);align-items:center;margin-top:clamp(28px,3vw,44px);}
  .imx-mt__pane.is-on{display:grid;animation:imxPaneIn .7s var(--imx-ease);}
  @keyframes imxPaneIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .imx-mt__ph{border-radius:6px;overflow:hidden;aspect-ratio:16/10;background:var(--imx-bg2);}
  .imx-mt__ph img{width:100%;height:100%;object-fit:cover;object-position:var(--p,50% 50%);}
  .imx-mt__tag{font:500 11px/1 var(--imx-text);letter-spacing:.2em;text-transform:uppercase;color:var(--imx-accent);}
  .imx-mt__t{font:300 clamp(28px,2.8vw,44px)/1.05 var(--imx-display);letter-spacing:-.035em;margin:16px 0 18px;}
  .imx-mt__t b{font-weight:500;}
  .imx-mt__d{font-size:clamp(15px,1.1vw,16px);line-height:1.65;color:var(--imx-mute);}
  .imx-mt__list{list-style:none;margin-top:24px;padding-top:22px;border-top:1px solid var(--imx-line);display:grid;gap:12px;}
  .imx-mt__list li{display:flex;gap:12px;font-size:14px;line-height:1.5;}
  .imx-mt__list li::before{content:"";flex:0 0 5px;height:5px;margin-top:8px;border-radius:50%;background:var(--imx-accent);}
  .imx-mt__note{font-size:11px;color:var(--imx-dim);margin-top:16px;}
  @media (max-width:900px){.imx-mt__pane{grid-template-columns:1fr;}}

  /* ── m7 · характеристики ── */
  .imx-ms__wrap{position:relative;}
  .imx-ms__scroll{overflow-x:auto;}
  .imx-ms table{width:100%;border-collapse:collapse;}
  @media (max-width:700px){
    .imx-ms th,.imx-ms td{font-size:13px;padding:12px 10px 12px 0;}
    .imx-ms tbody th{width:38%;}
    .imx-ms td:not([colspan]){white-space:nowrap;}
    .imx-ms thead th{font-size:10.5px;letter-spacing:.08em;}
  }
  .imx-ms th,.imx-ms td{text-align:left;padding:15px 18px 15px 0;border-bottom:1px solid var(--imx-line);font-size:14px;line-height:1.45;vertical-align:top;font-weight:400;}
  .imx-ms thead th{font:500 12px/1.35 var(--imx-text);letter-spacing:.12em;text-transform:uppercase;color:var(--imx-fg);border-bottom-color:rgba(244,242,238,.3);padding-bottom:18px;}
  .imx-ms tbody th{color:var(--imx-mute);width:34%;}
  .imx-ms td{font-variant-numeric:tabular-nums;}
  .imx-ms th:first-child{position:sticky;left:0;background:var(--imx-bg);z-index:1;}
  .imx-ms tr.imx-ms__grp th{padding-top:44px;font:400 clamp(20px,1.6vw,24px)/1.2 var(--imx-display);letter-spacing:-.02em;color:var(--imx-fg);border-bottom-color:rgba(244,242,238,.3);}
  .imx-ms tr.imx-ms__grp:first-child th{padding-top:12px;}
  .imx-ms.is-short tr[data-x]{display:none;}
  .imx-ms__more{margin-top:28px;}
  .imx-ms:not(.is-short) .imx-ms__more .is-closed,.imx-ms.is-short .imx-ms__more .is-open{display:none;}
  .imx-ms__note{font-size:11px;color:var(--imx-dim);margin-top:24px;max-width:920px;line-height:1.6;}

  /* ── m8 · другие модели ── */
  .imx-mm{border-top:1px solid var(--imx-line);}
  .imx-mm__grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.2vw,16px);}
  .imx-mm__card{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 50% 62%,#25252a 0%,#141416 60%,#101012 100%);padding:18px 18px 20px;transition:background .5s;}
  .imx-mm__ph{aspect-ratio:4/3;margin:0 -6px 14px;}
  /* --s/--tx/--ty (из build-pages.pl) выравнивают машины: одного размера, по центру, колёса на одной линии */
  .imx-mm__ph img{width:100%;height:100%;object-fit:contain;transform:translate(var(--tx,0%),var(--ty,0%)) scale(var(--s,1));transition:transform 1.1s var(--imx-ease);}
  .imx-mm__card:hover .imx-mm__ph img{transform:translate(calc(var(--tx,0%) + 6px),var(--ty,0%)) scale(calc(var(--s,1) * 1.06));}
  .imx-mm__card b{font:400 24px/1 var(--imx-brand);}
  .imx-mm__card b strong{font-weight:700;}
  .imx-mm__card span{font-size:12px;color:var(--imx-mute);margin-top:8px;}
  @media (max-width:1100px){
    .imx-mm__grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(var(--imx-pad)*-1);padding:0 var(--imx-pad);scroll-padding:0 var(--imx-pad);}
    .imx-mm__grid::-webkit-scrollbar{display:none;}
    .imx-mm__card{flex:0 0 min(300px,64vw);scroll-snap-align:start;}
  }

  /* ── внутренние страницы: верх без фото (тест-драйв, салон, документы, 404) ── */
  .imx-ph{background:var(--imx-bg);padding:clamp(130px,16vw,200px) 0 clamp(40px,5vw,72px);}

<script>
  /* Запуск интерактивных частей страниц. В Tilda Vibe-блоки вставляют свой код уже после загрузки страницы,
     поэтому всё запускается повторно, когда в документе появляются новые элементы, — и каждый элемент только один раз. */
  (function(){
    if(window.imxInit) return;
    function once(el){ if(el.hasAttribute('data-imx-t')) return false; el.setAttribute('data-imx-t',''); return true; }
    function lang(){ return (window.imxLang&&window.imxLang())||document.documentElement.getAttribute('data-imx-lang')||'az'; }

    /* ленты со стрелками: [data-imx-track] + [data-imx-prev]/[data-imx-next] в той же секции */
    function tracks(){
      document.querySelectorAll('[data-imx-track]').forEach(function(track){
        if(!once(track)) return;
        var sec=track.closest('section')||document, prev=sec.querySelector('[data-imx-prev]'), next=sec.querySelector('[data-imx-next]');
        function upd(){var max=track.scrollWidth-track.clientWidth-2;if(prev)prev.disabled=track.scrollLeft<=2;if(next)next.disabled=track.scrollLeft>=max;}
        function step(d){var it=track.firstElementChild;var w=it?it.getBoundingClientRect().width+16:400;track.scrollBy({left:d*w,behavior:'smooth'});}
        if(prev)prev.addEventListener('click',function(){step(-1);});
        if(next)next.addEventListener('click',function(){step(1);});
        track.addEventListener('scroll',upd,{passive:true});window.addEventListener('resize',upd);upd();
      });
    }
    /* вкладки: [data-imx-tabs] с кнопками [data-tab], панели [data-pane] в той же секции */
    function tabs(){
      document.querySelectorAll('[data-imx-tabs]').forEach(function(tb){
        if(!once(tb)) return;
        var sec=tb.closest('section');
        tb.addEventListener('click',function(e){
          var b=e.target.closest('[data-tab]'); if(!b) return;
          var k=b.getAttribute('data-tab');
          tb.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('is-on',x===b);x.setAttribute('aria-selected',x===b?'true':'false');});
          sec.querySelectorAll('[data-pane]').forEach(function(p){p.classList.toggle('is-on',p.getAttribute('data-pane')===k);});
          b.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
        });
      });
    }
    /* цвета: образец переключает фото машины и название */
    function colors(){
      document.querySelectorAll('.imx-mc').forEach(function(sec){
        if(!once(sec)) return;
        var sw=sec.querySelectorAll('.imx-mc__sw button'), cars=sec.querySelectorAll('.imx-mc__car'), names=sec.querySelectorAll('.imx-mc__name > span');
        sw.forEach(function(b,i){b.addEventListener('click',function(){
          [sw,cars,names].forEach(function(list){list.forEach(function(el,j){el.classList.toggle('is-on',j===i);});});
          var im=cars[i]&&cars[i].querySelector('img'); if(im&&im.loading==='lazy') im.loading='eager';
        });});
      });
    }
    /* характеристики: «Все характеристики» */
    function more(){
      document.querySelectorAll('[data-imx-more]').forEach(function(b){
        if(!once(b)) return;
        b.addEventListener('click',function(){var s=b.closest('.imx-ms');s.classList.toggle('is-short');if(s.classList.contains('is-short'))s.scrollIntoView({behavior:'smooth'});});
      });
    }
    /* подменю модели: появляется, когда шапка модели ушла вверх */
    function subnav(){
      var sub=document.querySelector('.imx-msub'), hero=document.querySelector('.imx-mh');
      if(!sub||!hero||!once(sub)) return;
      var links=[].slice.call(sub.querySelectorAll('.imx-msub__nav a'));
      function onScroll(){
        var hdr=document.getElementById('imxHdr'), on=hero.getBoundingClientRect().bottom<70;
        sub.classList.toggle('is-on',on);
        sub.classList.toggle('is-under',!!hdr&&!hdr.classList.contains('is-hidden'));
        var cur=-1;
        links.forEach(function(a,i){var t=document.getElementById(a.getAttribute('href').slice(1));if(t&&t.getBoundingClientRect().top<window.innerHeight*.4)cur=i;});
        links.forEach(function(a,i){
          var was=a.classList.contains('is-on');a.classList.toggle('is-on',i===cur);
          if(i===cur&&!was&&on){var nav=a.parentNode;nav.scrollTo({left:a.offsetLeft-nav.clientWidth/2+a.offsetWidth/2,behavior:'smooth'});}
        });
      }
      window.addEventListener('scroll',onScroll,{passive:true});onScroll();
    }
    /* активная кнопка языка (шапка может появиться позже скрипта языков) */
    function langBtns(){ var l=lang(); document.querySelectorAll('[data-imx-setlang]').forEach(function(b){b.classList.toggle('is-on',b.getAttribute('data-imx-setlang')===l);}); }
    /* появление при прокрутке для элементов, вставленных позже */
    var io=null;
    function reveal(){
      var els=document.querySelectorAll('.imx-r:not(.is-in):not([data-imx-o])'); if(!els.length) return;
      if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('is-in');});return;}
      if(!io) io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('is-in');io.unobserve(en.target);}});},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
      els.forEach(function(e){e.setAttribute('data-imx-o','');io.observe(e);});
    }
    function all(){ langBtns(); tracks(); tabs(); colors(); more(); subnav(); if(window.imxStockInit) window.imxStockInit(); reveal(); }
    var timer=null; function schedule(){ if(timer) return; timer=setTimeout(function(){timer=null;all();},40); }
    window.imxInit=schedule;
    if(document.readyState!=='loading') schedule(); else document.addEventListener('DOMContentLoaded',schedule);
    window.addEventListener('load',schedule);
    if('MutationObserver' in window) new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){if(ms[i].addedNodes.length){schedule();return;}}}).observe(document.documentElement,{childList:true,subtree:true});
  })();
</script>

  .imx-stock__name{font:400 26px/1.1 var(--imx-brand);letter-spacing:-.01em;}

  .imx-stock__trim{display:block;font:400 14px/1.4 var(--imx-text);letter-spacing:0;color:var(--imx-mute);margin-top:6px;}
  .imx-stock__specs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--imx-line);}
  .imx-stock__specs div{font:400 16px/1 var(--imx-display);letter-spacing:-.01em;white-space:nowrap;}
  .imx-stock__specs small{display:block;font:400 10px/1.3 var(--imx-text);letter-spacing:.12em;text-transform:uppercase;color:var(--imx-dim);margin-top:7px;}
  .imx-stock__chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;min-height:24px;}
  .imx-stock__chips span{font-size:11px;color:var(--imx-mute);border:1px solid var(--imx-line);border-radius:999px;padding:5px 10px;}

<script>
  /* ── блок «в наличии»: данные turbo.az из снимка (Apps Script), кэш 10 минут ── */
  (function(){
    function run(){
  var sec=document.getElementById('imxStock'); if(!sec||sec.hasAttribute('data-imx-t')) return; sec.setAttribute('data-imx-t','');
  var track=document.getElementById('imxStockTrack'), count=document.getElementById('imxStockCount'),
      prev=document.getElementById('imxStockPrev'), next=document.getElementById('imxStockNext'),
      endpoint=sec.getAttribute('data-endpoint')||'', salon=sec.getAttribute('data-salon'),
      KEY='imx-stock-v1', TTL=10*60*1000;
  // на странице модели (data-model="LS9") показываем только эту модель
  var model=sec.getAttribute('data-model')||'', only=model?new RegExp('\\b'+model+'\\b','i'):null;

  function t(az,ru,en){return '<span data-l="az">'+az+'</span><span data-l="ru">'+ru+'</span><span data-l="en">'+en+'</span>';}
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var ARROW='<svg viewBox="0 0 16 16" fill="none"><path d="M5 11l6-6M6 5h5v5" stroke="currentColor" stroke-width="1.4"/></svg>';

  function card(it){
    var words=String(it.name||'').split(' '), model=words.slice(0,2).join(' '), trim=words.slice(2).join(' ');
    var isNew=/^0\s*km$/i.test(String(it.km).trim());
    var badges='<span class="imx-stock__badge">'+t('Salonda','В салоне','In stock')+'</span>'+
               (isNew?'<span class="imx-stock__badge imx-stock__badge--new">'+t('Yeni','Новый','New')+'</span>':'');
    var chips=(it.loan?'<span>'+t('Kredit','Кредит','Financing')+'</span>':'')+(it.barter?'<span>'+t('Barter','Бартер','Trade-in')+'</span>':'');
    var engineLbl=/kwh/i.test(it.engine)?t('Batareya','Батарея','Battery'):t('Mühərrik','Двигатель','Engine');
    return '<a class="imx-stock__card" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+
      '<div class="imx-stock__ph"><img loading="lazy" alt="'+esc(it.name)+'" src="'+esc(it.img)+'" onload="this.classList.add(\'is-loaded\')" />'+
        '<div class="imx-stock__badges">'+badges+'</div></div>'+
      '<div class="imx-stock__body">'+
        '<div class="imx-stock__name">'+esc(model).replace(/^(IM)\s+(.+)$/,'$1 <b>$2</b>')+(trim?'<span class="imx-stock__trim">'+esc(trim)+'</span>':'')+'</div>'+
        '<div class="imx-stock__specs">'+
          '<div>'+esc(it.year)+'<small>'+t('Buraxılış ili','Год выпуска','Year')+'</small></div>'+
          '<div>'+esc(it.km)+'<small>'+t('Yürüş','Пробег','Mileage')+'</small></div>'+
          '<div>'+esc(it.engine)+'<small>'+engineLbl+'</small></div>'+
        '</div>'+
        '<div class="imx-stock__chips">'+chips+'</div>'+
        '<div class="imx-stock__foot"><span>'+t('turbo.az-da bax','Смотреть на turbo.az','View on turbo.az')+'</span>'+ARROW+'</div>'+
      '</div></a>';
  }

  function render(data){
    var items=((data&&data.items)||[]).filter(function(it){return !only||only.test(it.name||'');});
    var empty=sec.querySelector('.imx-stock__empty'), all=document.getElementById('imxStockAll');
    if(!items.length){
      if(!empty){
        empty=document.createElement('div'); empty.className='imx-stock__empty';
        if(model){
          var wa='https://wa.me/994994400007?text='+encodeURIComponent('Salam! IM '+model+' ilə maraqlanıram.');
          empty.innerHTML=t('Hazırda salonda IM '+model+' yoxdur. Gəliş tarixini və sifariş şərtlərini öyrənmək üçün bizə yazın.','Сейчас IM '+model+' в салоне нет. Напишите нам — подскажем сроки поставки и условия заказа.','There is no IM '+model+' in the showroom right now. Message us for delivery times and order terms.')+
            '<br><a class="imx-btn imx-btn--solid" target="_blank" rel="noopener" href="'+wa+'">'+t('WhatsApp ilə yazın','Написать в WhatsApp','Message on WhatsApp')+'</a>';
          track.parentNode.insertBefore(empty,track);
          track.hidden=true; all.hidden=true; count.hidden=true;
          sec.querySelector('.imx-stock__nav').hidden=true;
          return;
        }
        empty.innerHTML=t('Hazırda salonda olan avtomobillərin siyahısı yenilənir.','Список автомобилей в салоне сейчас обновляется.','The in-stock list is being updated.')+
          '<br><a class="imx-btn imx-btn--ghost" target="_blank" rel="noopener" href="'+esc(salon)+'">'+t('turbo.az-da bax','Смотреть на turbo.az','View on turbo.az')+'</a>';
        track.parentNode.insertBefore(empty,track);
      }
      track.hidden=true; all.hidden=true; count.hidden=true;
      sec.querySelector('.imx-stock__nav').hidden=true;
      return;
    }
    if(empty) empty.remove();
    track.hidden=false; all.hidden=false; sec.querySelector('.imx-stock__nav').hidden=false;
    track.innerHTML=items.map(card).join('');
    track.querySelectorAll('img').forEach(function(im){if(im.complete&&im.naturalWidth)im.classList.add('is-loaded');});
    count.hidden=false;
    count.innerHTML='<b>'+items.length+'</b>'+t('avtomobil salonda','автомобилей в салоне','cars in the showroom');
    updNav();
  }

  function updNav(){
    var max=track.scrollWidth-track.clientWidth-2;
    prev.disabled=track.scrollLeft<=2; next.disabled=track.scrollLeft>=max;
    sec.querySelector('.imx-stock__nav').style.visibility=max>0?'visible':'hidden';
  }
  function step(dir){var c=track.querySelector('.imx-stock__card');var w=c?c.getBoundingClientRect().width+16:320;track.scrollBy({left:dir*w,behavior:'smooth'});}
  prev.addEventListener('click',function(){step(-1);});
  next.addEventListener('click',function(){step(1);});
  track.addEventListener('scroll',updNav,{passive:true});
  window.addEventListener('resize',updNav);

  // 1) мгновенно — из кэша браузера
  var cached=null;
  try{cached=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  if(cached&&cached.data) render(cached.data);

  // 2) пример для локального превью (build.sh), пока посредник не подключён
  if(!/^https?:\/\//.test(endpoint)){
    if(window.IMX_STOCK_SAMPLE) render(window.IMX_STOCK_SAMPLE);
    else if(!cached) render({items:[]});
    return;
  }
  if(cached&&Date.now()-cached.ts<TTL) return;

  // 3) свежие данные от посредника
  fetch(endpoint).then(function(r){if(!r.ok)throw r.status;return r.json();}).then(function(data){
    if(data&&data.items&&data.items.length){try{localStorage.setItem(KEY,JSON.stringify({ts:Date.now(),data:data}));}catch(e){}}
    render(data);
  }).catch(function(){ if(!cached) render({items:[]}); });
    }
    window.imxStockInit=run;
    if(document.readyState!=='loading')run();else document.addEventListener('DOMContentLoaded',run);
  })();
</script>
