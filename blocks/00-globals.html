  :root{

    --imx-bg:#0a0a0b; --imx-bg2:#111113; --imx-bg3:#19191c;
    --imx-fg:#f4f2ee; --imx-mute:rgba(244,242,238,.66); --imx-dim:rgba(244,242,238,.42);
    --imx-line:rgba(244,242,238,.12);
    /* светлая «бумага» для контрастных секций */
    --imx-paper:#f1eee9; --imx-ink:#0e0e10; --imx-ink2:#5f5c57; --imx-pline:rgba(14,14,16,.12);
    /* акцент IM — тёплый терракот */
    --imx-accent:#e57349; --imx-accent-d:#c85a30;

    --imx-display:'Inter Tight','Inter',system-ui,-apple-system,sans-serif;
    --imx-text:'Inter',system-ui,-apple-system,sans-serif;
    /* фирменный шрифт — только для «IM» и названий моделей */
    --imx-brand:'IM Sans','Inter Tight','Inter',system-ui,sans-serif;
    --imx-ease:cubic-bezier(.2,.7,.1,1);
    --imx-pad:clamp(20px,4vw,56px);
    --imx-max:1440px;
  }
  body{background:var(--imx-bg);}

  .imx{font-family:var(--imx-text);color:var(--imx-fg);line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  .imx *,.imx *::before,.imx *::after{box-sizing:border-box;}
  :where(.imx) a{color:inherit;text-decoration:none;}
  :where(.imx) img{display:block;max-width:100%;}
  :where(.imx) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
  :where(.imx) :is(h1,h2,h3,p,ul){margin:0;padding:0;}
  .imx-wrap{max-width:var(--imx-max);margin:0 auto;padding:0 var(--imx-pad);}
  .imx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* ── типографика ── */
  .imx-eyebrow{display:inline-flex;align-items:center;gap:12px;font:500 11px/1 var(--imx-text);letter-spacing:.22em;text-transform:uppercase;color:var(--imx-mute);}
  .imx-eyebrow::before{content:'';width:28px;height:1px;background:var(--imx-accent);}
  .imx-h2{font:300 clamp(36px,5.4vw,80px)/1 var(--imx-display);letter-spacing:-.04em;}
  .imx-h2 b{font-weight:500;}
  .imx-lead{font-size:clamp(15px,1.15vw,17px);line-height:1.65;color:var(--imx-mute);max-width:520px;}

  /* ── кнопки ── */
  .imx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 28px;border-radius:999px;font:500 14px/1 var(--imx-text);letter-spacing:.01em;white-space:nowrap;transition:background .35s,color .35s,border-color .35s;}
  .imx-btn--solid{background:var(--imx-fg);color:var(--imx-ink);}
  .imx-btn--solid:hover{background:var(--imx-accent);color:#fff;}
  .imx-btn--ghost{border:1px solid rgba(244,242,238,.32);color:var(--imx-fg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .imx-btn--ghost:hover{border-color:var(--imx-fg);background:rgba(244,242,238,.08);}
  .imx-btn--accent{background:var(--imx-accent);color:#fff;}
  .imx-btn--accent:hover{background:var(--imx-accent-d);}
  .imx-btn--ink{background:var(--imx-ink);color:var(--imx-paper);}
  .imx-btn--ink:hover{background:var(--imx-accent);color:#fff;}
  .imx-btn--sm{height:40px;padding:0 18px;font-size:13px;}
  .imx-btn svg{width:16px;height:16px;transition:transform .35s var(--imx-ease);}
  .imx-btn:hover svg{transform:translateX(4px);}

  /* ── языки: показываем только активный ── */
  html:not([data-imx-lang]) .imx [data-l]:not([data-l="az"]),
  html[data-imx-lang="az"] .imx [data-l]:not([data-l="az"]),
  html[data-imx-lang="ru"] .imx [data-l]:not([data-l="ru"]),
  html[data-imx-lang="en"] .imx [data-l]:not([data-l="en"]){display:none !important;}

  /* ── появление при скролле ── */
  .imx-r{opacity:0;transform:translateY(32px);transition:opacity 1.1s var(--imx-ease),transform 1.1s var(--imx-ease);}
  .imx-r.is-in{opacity:1;transform:none;}
  .imx-r[data-d="1"]{transition-delay:.08s;} .imx-r[data-d="2"]{transition-delay:.16s;}
  .imx-r[data-d="3"]{transition-delay:.24s;} .imx-r[data-d="4"]{transition-delay:.32s;}

  @media (prefers-reduced-motion:reduce){
    .imx-r{opacity:1;transform:none;transition:none;}
    .imx *{animation:none !important;transition-duration:.01s !important;}
  }
</style>
<script>
  (function(){
    var LANGS=['az','ru','en'], root=document.documentElement, stored=null;
    try{stored=localStorage.getItem('imx-lang');}catch(e){}
    var q=new URLSearchParams(location.search).get('lang');
    // в редакторе SpectrTech (?st_edit=1) язык задаёт только адрес: без ?lang= — AZ
    if(/(?:^|&)st_edit=1(?:&|$)/.test(location.search.slice(1)))stored=null;
    var lang=LANGS.indexOf(q)>-1?q:(LANGS.indexOf(stored)>-1?stored:'az');

    function setLang(l){
      lang=l;
      root.setAttribute('data-imx-lang',l);
      root.lang=l;
      try{localStorage.setItem('imx-lang',l);}catch(e){}
      document.querySelectorAll('[data-imx-setlang]').forEach(function(b){
        b.classList.toggle('is-on',b.getAttribute('data-imx-setlang')===l);
      });
      document.dispatchEvent(new CustomEvent('imx:lang',{detail:l}));
    }
    window.imxSetLang=setLang;
    window.imxLang=function(){return lang;};
    setLang(lang);

    document.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('[data-imx-setlang]');
      if(b){e.preventDefault();setLang(b.getAttribute('data-imx-setlang'));}
    });

    function reveal(){
      var els=document.querySelectorAll('.imx-r:not(.is-in)');
      if(!('IntersectionObserver' in window)){els.forEach(function(el){el.classList.add('is-in');});return;}
      var io=new IntersectionObserver(function(entries){
        entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('is-in');io.unobserve(en.target);}});
      },{threshold:.12,rootMargin:'0px 0px -6% 0px'});
      els.forEach(function(el){io.observe(el);});
    }
    window.imxReveal=reveal;
    function ready(){setLang(lang);reveal();}
    if(document.readyState!=='loading')ready();else document.addEventListener('DOMContentLoaded',ready);
  })();
</script>
